name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LiteLauncher-apk
          path: app/build/outputs/apk/release/*.apk
      # Copia l'APK anche su un ramo "apk-<ramo>": si scarica senza fare login
      - name: Pubblica l'APK su un ramo
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/LiteLauncher.apk
          cd out
          git init -q -b apk
          git add LiteLauncher.apk
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "APK di ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk:apk-${GITHUB_REF_NAME}
