   name: Build APK

   on:
     push:
     workflow_dispatch:

   jobs:
     build:
       runs-on: ubuntu-latest
       defaults:
         run:
           working-directory: LiteLauncher
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: '17'
         - uses: gradle/actions/setup-gradle@v4
           with:
             gradle-version: '8.9'
         - run: gradle assembleRelease --no-daemon
         - uses: actions/upload-artifact@v4
           with:
             name: LiteLauncher-apk
             path: LiteLauncher/app/build/outputs/apk/release/*.apk
