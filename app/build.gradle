plugins {
    id 'com.android.application'
}

android {
    namespace 'it.tony.litelauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'it.tony.litelauncher'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Firmato con la chiave di debug: va bene per installarlo via ADB sul proprio TV
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
