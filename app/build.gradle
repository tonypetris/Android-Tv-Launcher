plugins {
    id 'com.android.application'
}

android {
    namespace 'it.tony.litelauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'it.tony.litelauncher'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '4.1'
    }

    signingConfigs {
        // Chiave fissa: ogni compilazione ha la stessa firma, quindi gli aggiornamenti si installano sopra
        fixed {
            storeFile file('release.keystore')
            storePassword 'litelauncher'
            keyAlias 'litelauncher'
            keyPassword 'litelauncher'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
